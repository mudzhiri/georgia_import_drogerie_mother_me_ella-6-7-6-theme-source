# Single default locale: locales/en.default.json (Georgian is locales/ka.json)
extends: theme-check:recommended

# Ignore noisy vendor-theme complexity; keep translation checks on.
LiquidComplexity:
  enabled: false

ExcessiveSettingsCount:
  enabled: false

# Only maintain KA/EN/DE/RU (+ en.default). Vendor Ella locales create false MatchingTranslations noise.
ignore:
  - locales/ar.json
  - locales/bg.json
  - locales/cs.json
  - locales/da.json
  - locales/el.json
  - locales/es.json
  - locales/fi.json
  - locales/fr.json
  - locales/hi.json
  - locales/hr.json
  - locales/hu.json
  - locales/id.json
  - locales/it.json
  - locales/ja.json
  - locales/ko.json
  - locales/lt.json
  - locales/nb.json
  - locales/nl.json
  - locales/pl.json
  - locales/pt-BR.json
  - locales/pt-PT.json
  - locales/ro.json
  - locales/sk.json
  - locales/sl.json
  - locales/sv.json
  - locales/th.json
  - locales/tr.json
  - locales/vi.json
  - locales/zh-CN.json
  - locales/zh-TW.json
  - .preview/**

  - locales/_unused_vendor/**
